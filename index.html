<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IT Legends</title>
    <meta name="theme-color" content="#14123a" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=13" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "./src/character.js": "./src/character.js?v=13",
          "./src/cloud.js": "./src/cloud.js?v=13",
          "./src/data.js": "./src/data.js?v=13",
          "./src/firebase-config.js": "./src/firebase-config.js?v=13",
          "./src/game/names.js": "./src/game/names.js?v=13",
          "./src/game/rules.js": "./src/game/rules.js?v=13",
          "./src/game/state.js": "./src/game/state.js?v=13",
          "./src/icons.js": "./src/icons.js?v=13",
          "./src/main.js": "./src/main.js?v=13",
          "./src/office.js": "./src/office.js?v=13",
          "./src/show.js": "./src/show.js?v=13",
          "./src/stage.js": "./src/stage.js?v=13",
          "./src/version.js": "./src/version.js?v=13"
        }
      }
    </script>
  </head>
  <body>
    <!-- タイトル → 名前 → 会社 → 職種（main.js の showTitle / initStart） -->
    <section id="start" class="start hidden">
      <div class="step title-step active" data-step="0">
        <div class="title-art"></div>
        <div class="title-text">
          <h1>IT LEGENDS</h1>
          <p>伝説のIT会社をつくれ</p>
        </div>
        <div class="title-actions">
          <button class="big" id="btn-continue">つづきから</button>
          <button class="big" id="btn-new">はじめから</button>
          <div class="title-msg" id="title-msg"></div>
        </div>
      </div>
      <div class="step" data-step="1">
        <div class="step-head"><button class="back" data-back aria-label="戻る"></button><div class="dots"><i class="on"></i><i></i><i></i></div></div>
        <label class="field"><span>あなたの名前</span><input id="start-name" maxlength="12" placeholder="例：山田 太郎" autocomplete="off" /></label>
        <button class="big" data-next>次へ</button>
      </div>
      <div class="step" data-step="2">
        <div class="step-head"><button class="back" data-back aria-label="戻る"></button><div class="dots"><i class="on"></i><i class="on"></i><i></i></div></div>
        <label class="field"><span>会社の名前</span><input id="start-company" maxlength="16" placeholder="例：ガレージ・ラボ" autocomplete="off" /></label>
        <button class="big" data-next>次へ</button>
      </div>
      <div class="step" data-step="3">
        <div class="step-head"><button class="back" data-back aria-label="戻る"></button><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
        <div class="field"><span>あなたの職種</span></div>
        <div id="start-jobs" class="jobs"></div>
        <div class="job-go"><button id="start-go" class="big" disabled>この職種ではじめる</button></div>
      </div>
    </section>

    <div id="game" class="hidden">
      <header class="top">
        <div class="company">
          <div id="company-name" class="cname"></div>
          <div class="nums"><span id="money"></span><span id="rep"></span></div>
        </div>
        <div class="hbtns">
          <button class="sync login" aria-label="ログイン"></button>
          <button id="open-settings" class="icon-btn" aria-label="設定"></button>
        </div>
      </header>

      <main>
        <section id="view-office" class="view active">
          <div class="stage-wrap office">
            <canvas id="office-canvas"></canvas>
            <div id="office-chips" class="chips"></div>
            <div id="encounter"></div>
          </div>
          <div id="office-info"></div>
          <ul id="log" class="log"></ul>
        </section>
        <section id="view-work" class="view"></section>
        <section id="view-team" class="view"></section>
        <section id="view-product" class="view"></section>
        <section id="view-legends" class="view"><div id="zukan-grid" class="grid"></div></section>
      </main>

      <nav class="tabbar">
        <button class="tab active" data-view="office" data-icon="home">会社<i class="dot" id="dot-office"></i></button>
        <button class="tab" data-view="work" data-icon="task">仕事<i class="dot" id="dot-work"></i></button>
        <button class="tab" data-view="team" data-icon="people">仲間</button>
        <button class="tab" data-view="product" data-icon="box">製品</button>
        <button class="tab" data-view="legends" data-icon="crown">偉人</button>
      </nav>
    </div>

    <dialog id="assign" class="sheet">
      <div id="assign-body"></div>
    </dialog>

    <dialog id="detail">
      <button class="close" aria-label="閉じる">×</button>
      <div class="detail-body">
        <div class="stage-wrap small"><canvas id="detail-canvas"></canvas></div>
        <div id="detail-info" class="info"></div>
      </div>
    </dialog>

    <dialog id="notice">
      <div id="notice-body"></div>
      <button class="big" id="notice-ok">OK</button>
    </dialog>

    <dialog id="settings">
      <button class="close" aria-label="閉じる">×</button>
      <div id="settings-body"></div>
    </dialog>

    <div id="version"></div>

    <script type="module" src="src/main.js?v=13"></script>
  </body>
</html>
